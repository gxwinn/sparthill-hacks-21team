<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dispute Packet | MedBill Shield</title>
  <style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#98b1dd;color:#000;font-family:Calibri,Carlito,Arial,sans-serif}
.screen{position:relative;width:100%;max-width:1280px;aspect-ratio:1280/837;
 margin:0 auto;container-type:inline-size;background:#98b1dd}
.placed{position:absolute;margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
 clip:rect(0,0,0,0);white-space:nowrap;border:0}
.field,.select-shell{border:1px solid #626262;border-radius:0;background:#d9d9d9}
.field{min-width:0;padding:0 1.15cqw;color:#000;font:400 2.58cqw Calibri,Carlito,Arial,sans-serif}
.field::placeholder{opacity:1;color:#000}
.field[type=number]{appearance:textfield}
.field::-webkit-inner-spin-button,.field::-webkit-outer-spin-button{appearance:none;margin:0}
.button{display:flex;align-items:center;justify-content:center;background:#31417d;color:white;
 border:1px solid #18234d;border-radius:0;text-decoration:none;text-align:center;
 font-size:3.75cqw;font-weight:400;line-height:1.2;padding:0 .6cqw}
.button:hover{background:#29396f}
.button.small{font-size:1.35cqw}
.heading{font-size:3.75cqw;font-weight:400;line-height:1.2;white-space:nowrap}
.form-label{font-size:2.58cqw;line-height:1.12;font-weight:400}
.select-shell select{appearance:none;border:0;border-radius:0;background:transparent;
 width:100%;height:100%;min-width:0;padding:0 4.6cqw 0 1.15cqw;
 color:#80817b;font:400 2.58cqw Calibri,Carlito,Arial,sans-serif}
.select-shell select:has(option:checked:not([value=""])){color:#000}
.select-shell option{color:#000;background:#fff}
.select-shell:after{content:"";position:absolute;right:1.2cqw;top:30%;width:0;height:0;
 border-left:1.25cqw solid transparent;border-right:1.25cqw solid transparent;
 border-top:2.5cqw solid #81837e;pointer-events:none}
input:focus-visible,select:focus-visible,a:focus-visible,[contenteditable]:focus-visible{
 outline:2px solid #173568;outline-offset:2px}
.brand-image,.bill-image{display:block;object-fit:contain}
.upload-box{border:1px solid #626262;background:#d9d9d9;cursor:pointer}
.upload-box .upload-icon{position:absolute;left:37%;top:4%;width:26%;height:48%;object-fit:contain}
.upload-box .upload-label{position:absolute;left:3%;right:3%;bottom:7%;text-align:center;
 font-size:2.58cqw;line-height:1.1}
.upload-box input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.upload-box:focus-within{outline:2px solid #173568;outline-offset:2px}
.card{border:1px solid #353b47;padding:1.65cqw 1.8cqw}
.card h2{margin:0;font-size:2.58cqw;font-weight:400;line-height:1.2}
.summary{background:#fff;color:#d43365}
.summary ul{list-style:none;padding:0;margin:2.5cqw 0 0}
.summary li{display:flex;align-items:center;gap:1.55cqw;margin:.9cqw 0;
 white-space:nowrap;font-size:1.65cqw;line-height:1.3}
.summary .warning{width:2.9cqw;height:2.9cqw;object-fit:contain}
.savings{background:#4c596f;color:#fff}
.savings ol{padding-left:2.9cqw;margin:1cqw 0 0;font-size:1.875cqw;line-height:1.28}
.savings li{padding-left:0;margin:.25cqw 0}
.savings .amount{display:block}
.packet-preview{display:none;max-width:960px;margin:20px auto;padding:20px;background:#fff;
 font:16px/1.5 Arial,sans-serif}
.packet-preview:target{display:block}
.packet-preview h2{font-size:22px}
.packet-draft{min-height:160px;padding:12px;border:1px solid #8d9bb1}
.note{font-size:14px;color:#4c596f}
.packet-preview a{color:#31417d}
@media print{body{background:#fff}.screen{display:none}.packet-preview{display:block;max-width:none;margin:0}}
</style>
  <script src="medbill-inputs-v6.js" defer></script>
</head>
<body>
  <main class="screen" aria-label="Dispute Packet">
    <h1 class="placed heading" style="left:3.750000%;top:5.256870%;width:70.312500%;height:7.407407%;" >Dispute Packet</h1><label class="placed heading" style="left:8.203125%;top:36.320191%;width:23.437500%;height:7.646356%;" for="language">Language</label><label class="sr-only" for="language">Language</label><div class="placed select-shell" style="left:36.093750%;top:35.244922%;width:33.281250%;height:9.199522%;"><select id="language" name="language"><option value="">Select language</option><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option></select></div><a class="placed button" style="left:33.515625%;top:48.626045%;width:38.515625%;height:17.084827%;" href="#packet-preview">Generate a dispute<br>packet</a><nav aria-label="Page navigation"><a class="placed button small" style="left:1.875000%;top:96.176822%;width:7.812500%;height:3.225806%;" href="medbill-review-v4.html">Back</a></nav>
  </main>
  
<section class="packet-preview" id="packet-preview" aria-labelledby="draft-title">
  <h2 id="draft-title">Dispute Packet Draft</h2>
  <p class="note">HTML-only placeholder. Connect your own JavaScript to populate this
    draft from the bill details and selected language. No packet file is generated.</p>
  <div class="packet-draft" contenteditable="true" role="textbox" aria-multiline="true"
       aria-label="Editable dispute packet draft">Add or edit your dispute packet draft here.</div>
  <p><a href="medbill-dispute-packet-v4.html">Return to Dispute Packet</a></p>
</section>

</body>
</html>
